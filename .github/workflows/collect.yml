name: Recolectar DGA

on:
  schedule:
    # Cada 30 min (UTC). GitHub puede atrasar las ejecuciones programadas varios minutos.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar-dga
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar DGA
        run: python collector/dga_collect.py data

      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos DGA $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
